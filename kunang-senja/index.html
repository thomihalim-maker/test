<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kunang Senja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;500;600&display=swap">
<style>
  /* Layout: satu layar penuh — kanvas lanskap senja, HUD tipis di sudut, kartu pembuka di tengah. */
  :root {
    --ink: #fdf3e7;          /* teks di atas langit */
    --ink-soft: #f3dcc8b3;   /* teks sekunder */
    --glow: #ffe7a3;         /* cahaya kunang-kunang */
    --veil: #1a1230a6;       /* tirai kartu */
    --line: #ffe7a340;       /* garis halus */
    --night: #120c24;        /* dasar latar */
    --font-display: "Marcellus", "Cormorant Garamond", Georgia, serif;
    --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden; background: var(--night); color: var(--ink);
    font-family: var(--font-body); -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  .hud {
    position: fixed; left: 0; right: 0; top: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 0;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    pointer-events: none;
  }
  .count { font-family: var(--font-display); font-size: 1.25rem; letter-spacing: .02em; font-variant-numeric: tabular-nums; text-shadow: 0 0 18px #ffe7a366; }
  .count small { font-family: var(--font-body); font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); margin-left: 6px; }
  .btn-icon {
    pointer-events: auto; border: 1px solid var(--line); background: #ffffff10; color: var(--ink);
    border-radius: 999px; padding: 8px 14px; font: 500 .78rem var(--font-body); letter-spacing: .08em;
    text-transform: uppercase; cursor: pointer; backdrop-filter: blur(6px);
  }
  .btn-icon:focus-visible, .start:focus-visible { outline: 2px solid var(--glow); outline-offset: 3px; }

  .whisper {
    position: fixed; left: 16px; right: 16px; top: 34%; text-align: center; pointer-events: none;
    font-family: var(--font-display); font-size: clamp(1.2rem, 4.6vw, 1.9rem); letter-spacing: .02em;
    text-wrap: balance; opacity: 0; transition: opacity 1.6s ease; text-shadow: 0 0 24px #00000055;
  }
  .whisper.on { opacity: .92; }

  .card {
    position: fixed; inset: 0; display: grid; place-items: center; padding-inline: 16px;
    background: radial-gradient(ellipse at center, var(--veil), transparent 70%);
    transition: opacity .9s ease;
  }
  .card.gone { opacity: 0; pointer-events: none; }
  .card-inner { max-width: 26rem; text-align: center; display: grid; gap: 14px; justify-items: center; }
  .eyebrow { font-size: .72rem; letter-spacing: .22em; text-transform: uppercase; color: var(--ink-soft); }
  h1 {
    margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(2.6rem, 11vw, 4.2rem);
    line-height: 1; letter-spacing: .01em; text-wrap: balance; text-shadow: 0 0 40px #ffe7a355;
  }
  .lede { margin: 0; font-size: 1rem; line-height: 1.6; color: var(--ink-soft); text-wrap: balance; }
  .start {
    margin-top: 6px; border: 0; border-radius: 999px; padding: 14px 34px; cursor: pointer;
    background: var(--glow); color: #2a1a3a; font: 600 1rem var(--font-body); letter-spacing: .04em;
    box-shadow: 0 0 40px #ffe7a380;
  }
  .best { font-size: .8rem; color: var(--ink-soft); letter-spacing: .06em; min-height: 1.2em; }
  .hint {
    position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
    text-align: center; font-size: .78rem; letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink-soft); pointer-events: none; transition: opacity 1.2s ease;
  }
  @media (prefers-reduced-motion: reduce) { .card, .whisper, .hint { transition: none; } }
</style>
</head>
<body>

<canvas id="c" aria-label="Lanskap senja dengan kunang-kunang"></canvas>

<div class="hud">
  <div class="count" aria-live="polite"><span id="count">0</span><small>cahaya</small></div>
  <button class="btn-icon" id="sound" type="button" aria-pressed="true">Suara: nyala</button>
</div>

<div class="whisper" id="whisper"></div>
<div class="hint" id="hint">Tahan untuk melayang · lepas untuk turun</div>

<div class="card" id="card">
  <div class="card-inner">
    <div class="eyebrow">Permainan untuk bernapas</div>
    <h1>Kunang Senja</h1>
    <p class="lede">Tahan layar agar kunang-kunang melayang, lepaskan agar ia turun pelan. Setiap cahaya yang kamu sentuh berbunyi sebagai nada. Tidak ada kalah, tidak ada waktu habis.</p>
    <button class="start" id="start" type="button">Mulai</button>
    <div class="best" id="best"></div>
  </div>
</div>

<script>
(() => {
  const cvs = document.getElementById('c');
  const ctx = cvs.getContext('2d');
  const $count = document.getElementById('count');
  const $whisper = document.getElementById('whisper');
  const $card = document.getElementById('card');
  const $hint = document.getElementById('hint');
  const $best = document.getElementById('best');
  const $sound = document.getElementById('sound');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let W = 0, H = 0;
  function resize() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cvs.width = Math.round(W * dpr); cvs.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', resize); resize();

  // ---------- storage (opsional) ----------
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  let best = parseInt(store.get('kunang-best') || '0', 10) || 0;

  // ---------- palet langit: senja → malam → fajar ----------
  const PALETTES = [
    { name: 'senja', top: '#2b1d4a', mid: '#8a4c7a', bot: '#f2a07b', hills: ['#7a4570', '#4e2c5c', '#2a1840'], stars: 0.35, moon: '#ffe2c2' },
    { name: 'malam', top: '#050817', mid: '#14204a', bot: '#2c3d74', hills: ['#1e2a5a', '#141c40', '#0a0f26'], stars: 1.0, moon: '#eef0ff' },
    { name: 'fajar', top: '#24406a', mid: '#7d8fb8', bot: '#f6c9a0', hills: ['#5f7397', '#3f5276', '#26334f'], stars: 0.15, moon: '#fff4dc' }
  ];
  const CYCLE = 50; // detik per palet
  const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const mix = (a, b, t) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',')})`; };
  const smooth = t => t * t * (3 - 2 * t);
  function palette(time) {
    const p = (time / CYCLE) % PALETTES.length;
    const i = Math.floor(p), j = (i + 1) % PALETTES.length;
    const f = p - i;
    const t = f < 0.7 ? 0 : smooth((f - 0.7) / 0.3); // tahan lama, transisi lembut
    const A = PALETTES[i], B = PALETTES[j];
    return {
      top: mix(A.top, B.top, t), mid: mix(A.mid, B.mid, t), bot: mix(A.bot, B.bot, t),
      hills: A.hills.map((h, k) => mix(h, B.hills[k], t)),
      stars: A.stars + (B.stars - A.stars) * t, moon: mix(A.moon, B.moon, t)
    };
  }

  // ---------- audio ----------
  let ac = null, master = null, echo = null, soundOn = true, droneGain = null;
  // Pentatonik C mayor, dua oktaf — tidak ada nada yang sumbang satu sama lain
  const SCALE = [1, 9 / 8, 5 / 4, 3 / 2, 5 / 3, 2, 9 / 4, 5 / 2, 3, 10 / 3, 4].map(r => 261.63 * r);
  function initAudio() {
    if (ac) { ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    master = ac.createGain(); master.gain.value = soundOn ? 0.9 : 0; master.connect(ac.destination);
    // gema sederhana
    const delay = ac.createDelay(2); delay.delayTime.value = 0.42;
    const fb = ac.createGain(); fb.gain.value = 0.38;
    const tone = ac.createBiquadFilter(); tone.type = 'lowpass'; tone.frequency.value = 2200;
    delay.connect(tone); tone.connect(fb); fb.connect(delay); tone.connect(master);
    echo = ac.createGain(); echo.gain.value = 0.5; echo.connect(delay);
    // dengung latar
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 520;
    droneGain = ac.createGain(); droneGain.gain.value = 0;
    lp.connect(droneGain); droneGain.connect(master);
    [[65.41, -4], [98, 3], [130.81, 6]].forEach(([f, d]) => {
      const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = f; o.detune.value = d;
      const g = ac.createGain(); g.gain.value = 0.33; o.connect(g); g.connect(lp); o.start();
    });
    const lfo = ac.createOscillator(); lfo.frequency.value = 0.08;
    const lfoG = ac.createGain(); lfoG.gain.value = 0.018;
    lfo.connect(lfoG); lfoG.connect(droneGain.gain); lfo.start();
    droneGain.gain.linearRampToValueAtTime(0.05, ac.currentTime + 4);
  }
  function chime(step) {
    if (!ac || !soundOn) return;
    const f = SCALE[Math.min(step, SCALE.length - 1)];
    const t = ac.currentTime;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.16, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 2.2);
    g.connect(master); g.connect(echo);
    const o1 = ac.createOscillator(); o1.type = 'sine'; o1.frequency.value = f * 2;
    const o2 = ac.createOscillator(); o2.type = 'triangle'; o2.frequency.value = f * 4;
    const g2 = ac.createGain(); g2.gain.value = 0.12;
    o1.connect(g); o2.connect(g2); g2.connect(g);
    o1.start(t); o2.start(t); o1.stop(t + 2.3); o2.stop(t + 2.3);
  }
  $sound.addEventListener('click', e => {
    e.stopPropagation();
    soundOn = !soundOn;
    $sound.textContent = soundOn ? 'Suara: nyala' : 'Suara: mati';
    $sound.setAttribute('aria-pressed', String(soundOn));
    if (master) master.gain.setTargetAtTime(soundOn ? 0.9 : 0, ac.currentTime, 0.2);
  });
  $sound.addEventListener('pointerdown', e => e.stopPropagation());

  // ---------- dunia ----------
  const stars = Array.from({ length: 140 }, () => ({
    x: Math.random(), y: Math.random() * 0.7, r: Math.random() * 1.3 + 0.3, tw: Math.random() * 6.28, sp: 0.5 + Math.random() * 1.5
  }));
  const HILLS = [
    { speed: 0.12, base: 0.62, amp: [38, 18], freq: [0.0021, 0.0057], ph: 1.3 },
    { speed: 0.3,  base: 0.74, amp: [30, 14], freq: [0.0034, 0.0081], ph: 4.1 },
    { speed: 0.65, base: 0.86, amp: [22, 10], freq: [0.0049, 0.0113], ph: 2.2 }
  ];
  const player = { x: 0, y: 0, vy: 0, glow: 0 };
  addEventListener('resize', () => { player.x = Math.max(70, W * 0.28); });
  let lights = [], bursts = [], rings = [], trail = [], motes = [];
  let travelled = 0, time = 0, spawnIn = 0.5;
  let count = 0, streak = 0, holding = false, playing = false;

  const WHISPERS = [
    'Tarik napas perlahan…', 'Hembuskan, pelan-pelan.', 'Biarkan bahumu turun.',
    'Tidak perlu terburu-buru.', 'Dengarkan nadanya.', 'Di sini, sekarang, sudah cukup.',
    'Rahangmu boleh rileks.', 'Kamu sedang baik-baik saja.', 'Satu cahaya, satu napas.'
  ];
  let whisperIdx = 0, whisperTimer = 0;
  function whisper(text) {
    $whisper.textContent = text; $whisper.classList.add('on');
    whisperTimer = 4.5;
  }

  function speed() { return Math.max(110, Math.min(190, W * 0.14)); }
  function hillY(layer, x) {
    const L = HILLS[layer];
    const wx = x + travelled * L.speed;
    return H * L.base - L.amp[0] * Math.sin(wx * L.freq[0] + L.ph) - L.amp[1] * Math.sin(wx * L.freq[1] + L.ph * 2);
  }

  function spawnLight() {
    const top = H * 0.16, bottom = H * 0.66;
    const prev = lights.length ? lights[lights.length - 1].baseY : H * 0.4;
    // jaga jarak antar cahaya agar alurnya mengalir, tidak melompat
    const baseY = Math.max(top, Math.min(bottom, prev + (Math.random() - 0.5) * H * 0.32));
    lights.push({ x: W + 30, baseY, y: baseY, amp: 10 + Math.random() * 26, ph: Math.random() * 6.28, life: 0, taken: false, fade: 1 });
  }

  function reset(data) {
    player.x = Math.max(70, W * 0.28); player.y = H * 0.42; player.vy = 0;
    count = data && data.count || 0;
    $count.textContent = count;
  }

  // ---------- input ----------
  function down(e) {
    if (!playing) return;
    if (e && e.cancelable) e.preventDefault();
    holding = true; initAudio();
  }
  function up() { holding = false; }
  cvs.addEventListener('pointerdown', down);
  addEventListener('pointerup', up);
  addEventListener('pointercancel', up);
  addEventListener('blur', up);
  addEventListener('keydown', e => {
    if ((e.code === 'Space' || e.code === 'ArrowUp') && playing) { e.preventDefault(); down(); }
    if (e.code === 'Enter' && !playing) begin();
  });
  addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'ArrowUp') up(); });

  function begin() {
    if (playing) return;
    playing = true; initAudio();
    $card.classList.add('gone');
    setTimeout(() => { $hint.style.opacity = '0'; }, 7000);
    setTimeout(() => whisper('Tarik napas… lalu mulai.'), 900);
  }
  document.getElementById('start').addEventListener('click', begin);
  if (best > 0) $best.textContent = `Cahaya terbanyak: ${best}`;

  // ---------- loop ----------
  function update(dt) {
    time += dt;
    const sp = speed();
    travelled += sp * dt;

    // kunang-kunang
    if (playing) {
      const acc = holding ? -980 : 460;
      player.vy += acc * dt;
      player.vy *= Math.pow(0.18, dt); // redaman: gerakan terasa seperti melayang di air
      player.vy = Math.max(-340, Math.min(260, player.vy));
    } else {
      // mode tunggu: melayang mengikuti napas pelan
      const target = H * 0.42 + Math.sin(time * 0.9) * H * 0.06;
      player.vy += (target - player.y) * 3 * dt; player.vy *= Math.pow(0.2, dt);
    }
    player.y += player.vy * dt;
    const minY = H * 0.08, maxY = Math.min(hillY(2, player.x) - 26, H * 0.84);
    if (player.y < minY) { player.y = minY; player.vy *= -0.25; }
    if (player.y > maxY) { player.y = maxY; player.vy *= -0.25; }
    player.glow = Math.max(0, player.glow - dt * 1.4);

    trail.push({ x: player.x, y: player.y });
    for (const t of trail) t.x -= sp * dt * 0.9;
    while (trail.length > (reduced ? 10 : 26)) trail.shift();

    // cahaya
    if (playing) {
      spawnIn -= dt;
      if (spawnIn <= 0) { spawnLight(); spawnIn = 0.85 + Math.random() * 0.7; }
    }
    for (const l of lights) {
      l.life += dt;
      l.x -= sp * dt;
      l.y = l.baseY + Math.sin(time * 1.4 + l.ph) * l.amp;
      if (!l.taken && Math.hypot(l.x - player.x, l.y - player.y) < 30) {
        l.taken = true;
        count++; $count.textContent = count;
        chime(streak); streak = Math.min(streak + 1, SCALE.length - 1);
        player.glow = 1;
        rings.push({ x: l.x, y: l.y, r: 6, a: 0.8 });
        const n = reduced ? 5 : 14;
        for (let i = 0; i < n; i++) {
          const ang = (i / n) * 6.28 + Math.random() * 0.4, v = 40 + Math.random() * 70;
          bursts.push({ x: l.x, y: l.y, vx: Math.cos(ang) * v, vy: Math.sin(ang) * v, a: 1 });
        }
        if (count > best) { best = count; store.set('kunang-best', String(best)); }
        if (count % 12 === 0) { whisper(WHISPERS[whisperIdx % WHISPERS.length]); whisperIdx++; }
      }
      if (l.taken) l.fade -= dt * 3;
      if (!l.taken && l.x < -20) { streak = Math.max(0, streak - 3); l.fade = 0; }
    }
    lights = lights.filter(l => l.fade > 0 && l.x > -40);

    for (const b of bursts) { b.x += b.vx * dt - sp * dt * 0.3; b.y += b.vy * dt; b.vx *= Math.pow(0.1, dt); b.vy *= Math.pow(0.1, dt); b.vy -= 12 * dt; b.a -= dt * 0.9; }
    bursts = bursts.filter(b => b.a > 0);
    for (const r of rings) { r.r += 70 * dt; r.a -= dt * 0.9; r.x -= sp * dt * 0.3; }
    rings = rings.filter(r => r.a > 0);

    // debu cahaya di udara
    if (!reduced && motes.length < 22 && Math.random() < dt * 8) {
      motes.push({ x: W + 10, y: Math.random() * H * 0.85, r: Math.random() * 1.6 + 0.4, v: 0.2 + Math.random() * 0.5, ph: Math.random() * 6.28 });
    }
    for (const m of motes) { m.x -= sp * m.v * dt; m.y += Math.sin(time + m.ph) * 6 * dt; }
    motes = motes.filter(m => m.x > -10);

    if (whisperTimer > 0) { whisperTimer -= dt; if (whisperTimer <= 0) $whisper.classList.remove('on'); }
  }

  function glowDot(x, y, r, color, alpha) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(${color},${alpha})`);
    g.addColorStop(1, `rgba(${color},0)`);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
  }

  function draw() {
    const P = palette(time + 8);

    // langit
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, P.top); sky.addColorStop(0.55, P.mid); sky.addColorStop(1, P.bot);
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

    // bintang
    if (P.stars > 0.02) {
      ctx.fillStyle = '#ffffff';
      for (const s of stars) {
        const a = P.stars * (0.45 + 0.55 * Math.sin(time * s.sp + s.tw)) * (1 - s.y * 0.9);
        if (a <= 0) continue;
        ctx.globalAlpha = a;
        ctx.beginPath(); ctx.arc(((s.x * W - travelled * 0.02) % W + W) % W, s.y * H, s.r, 0, 6.2832); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // bulan / matahari rendah
    const mx = W * 0.76, my = H * 0.24, mr = Math.min(W, H) * 0.07;
    glowDot(mx, my, mr * 4, P.moon.match(/\d+/g).join(','), 0.18);
    ctx.fillStyle = P.moon; ctx.globalAlpha = 0.92;
    ctx.beginPath(); ctx.arc(mx, my, mr, 0, 6.2832); ctx.fill(); ctx.globalAlpha = 1;

    // bukit berlapis
    for (let k = 0; k < HILLS.length; k++) {
      ctx.fillStyle = P.hills[k];
      ctx.beginPath(); ctx.moveTo(0, H);
      for (let x = 0; x <= W + 8; x += 8) ctx.lineTo(x, hillY(k, x));
      ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
      if (k === 0) { // kabut tipis di antara lapisan
        const mist = ctx.createLinearGradient(0, H * 0.55, 0, H * 0.8);
        mist.addColorStop(0, 'rgba(255,240,230,0)'); mist.addColorStop(1, 'rgba(255,240,230,0.08)');
        ctx.fillStyle = mist; ctx.fillRect(0, H * 0.55, W, H * 0.45);
      }
    }

    // debu cahaya
    for (const m of motes) glowDot(m.x, m.y, m.r * 3, '255,231,163', 0.16);

    // cahaya untuk dikumpulkan
    for (const l of lights) {
      const pulse = 0.75 + 0.25 * Math.sin(time * 3 + l.ph);
      const a = Math.max(0, Math.min(1, l.fade)) * Math.min(1, l.life * 2);
      glowDot(l.x, l.y, 22 * pulse, '255,226,150', 0.45 * a);
      ctx.fillStyle = `rgba(255,250,232,${0.95 * a})`;
      ctx.beginPath(); ctx.arc(l.x, l.y, 3.6, 0, 6.2832); ctx.fill();
    }

    // riak
    for (const r of rings) {
      ctx.strokeStyle = `rgba(255,236,190,${r.a})`; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, 6.2832); ctx.stroke();
    }
    for (const b of bursts) glowDot(b.x, b.y, 5, '255,231,163', b.a * 0.9);

    // ekor cahaya
    for (let i = 0; i < trail.length; i++) {
      const t = trail[i], f = i / trail.length;
      glowDot(t.x, t.y, 4 + f * 8, '255,226,140', f * 0.22);
    }

    // kunang-kunang
    const bob = Math.sin(time * 6) * 1.2;
    const px = player.x, py = player.y + bob;
    glowDot(px, py, 46 + player.glow * 30, '255,220,120', 0.32 + player.glow * 0.25);
    glowDot(px, py, 16, '255,244,200', 0.9);
    // sayap tipis
    const flap = Math.sin(time * 28) * 0.5 + 0.5;
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.beginPath(); ctx.ellipse(px - 3, py - 5, 6, 2.5 + flap * 2, -0.6, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.ellipse(px + 3, py - 5, 6, 2.5 + flap * 2, 0.6, 0, 6.2832); ctx.fill();
    ctx.fillStyle = '#fffbe8';
    ctx.beginPath(); ctx.arc(px, py, 4.5, 0, 6.2832); ctx.fill();
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt); draw();
    requestAnimationFrame(frame);
  }

  function start(data) {
    reset(data);
    if (data && data.playing) begin();
    requestAnimationFrame(t => { last = t; frame(t); });
  }
  window.claude?.hot?.snapshot?.(() => ({ count, playing }));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
