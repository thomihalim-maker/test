<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block;width:100vw;height:100vh}</style>
<script type="importmap">{"imports":{"three":"/vendor/three-build/three.module.js","three/addons/":"/vendor/addons/"}}</script></head>
<body><canvas id="c"></canvas><script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { createCtx } from '/src/ctx.js'; import { load } from '/src/state.js';
const ctx=createCtx(document.getElementById('c')); ctx.state=load(); ctx.state.coins=9999; ctx.THREE=THREE;
const {renderer,scene,camera}=ctx; const composer=new EffectComposer(renderer); composer.addPass(new RenderPass(scene,camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(256,256),0.28,0.7,0.92)); composer.addPass(new OutputPass());
const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); composer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix();
const m=await import('/src/masjid/masjid.js'); ctx.modules.masjid=await m.init(ctx); window.__ctx=ctx;
const P=new URLSearchParams(location.search); window.__freeze=false;
if(P.has('play')){ const n=+P.get('play'); const M=ctx.modules.masjid; M.setStage(n-1); M.place(n); const T=+(P.get('at')||0); for(let i=0;i<T*30;i++){ctx.time+=1/30; M.update(1/30,ctx.time);} window.__freeze=true; }
const clock=new THREE.Clock(); let n=0; renderer.setAnimationLoop(()=>{const dt=Math.min(clock.getDelta(),1/30); if(!window.__freeze){ctx.time+=dt; ctx.modules.masjid.update(dt,ctx.time);} else ctx.modules.masjid.update(0,ctx.time); composer.render(); n++; window.__frames=n;});
</script></body></html>
