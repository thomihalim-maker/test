<style>
@font-face{font-family:"MarbotBoot";src:url(src/ui/fonts/nunito-latin-900-normal.woff2) format("woff2");font-weight:900;font-display:swap}
#boot{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  padding:24px calc(24px + env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) calc(24px + env(safe-area-inset-left,0px));
  background:radial-gradient(circle at 50% 38%,#fffbea 0%,#fff6e0 45%,#ffe9b8 100%);color:#5a3a1e;
  font:900 16px/1.3 "MarbotBoot","Nunito",ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;text-align:center;
  transition:opacity .55s ease,visibility 0s .55s;-webkit-user-select:none;user-select:none}
#boot.done{opacity:0;visibility:hidden;pointer-events:none}
#boot .logo{width:112px;height:112px;border-radius:26px;box-shadow:0 6px 0 #d6a85a,0 14px 26px rgba(90,50,10,.22);animation:bootBob 2.4s ease-in-out infinite}
#boot .name{font-size:28px;letter-spacing:.5px;margin-top:4px}
#boot .name b{color:#1f8f84}
#bootProgress{width:min(260px,70vw);height:14px;border-radius:99px;background:#f6d58e;box-shadow:inset 0 2px 0 rgba(150,90,20,.25);overflow:hidden}
#bootBar{height:100%;border-radius:99px;background:linear-gradient(90deg,#5fd3c3,#35b5a5);transform-origin:0 50%;transform:scaleX(.02);transition:transform .25s ease-out}
#bootLabel{font-size:14px;color:#8a6038;min-height:1.3em}
#bootVer{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));font-size:12px;color:#c9a468}
#bootMsg{display:none;max-width:520px}
#boot.msg #bootProgress,#boot.msg #bootLabel{display:none}
#boot.msg #bootMsg{display:block}
#boot.msg .logo{animation:none;filter:grayscale(.35)}
#bootMsg h1{font-size:22px;margin:0 0 10px}
#bootMsg p{font-size:15px;line-height:1.45;margin:0 0 8px;font-weight:800}
#bootMsg p.en{color:#8a6038;font-size:14px}
#bootMsg code{display:block;margin:10px auto 0;padding:8px 10px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:10px;background:#ffe9b8;color:#8a6038;font:600 12px ui-monospace,monospace}
#bootMsg .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
#boot button,.boot-toast button{font:inherit;border:0;cursor:pointer;border-radius:14px;padding:10px 18px;touch-action:manipulation}
#boot button.primary,.boot-toast button.primary{background:linear-gradient(#ffe58a,#ffc83d 55%,#f3a21a);color:#6b3d08;box-shadow:0 4px 0 #c47a0c}
#boot button.ghost{background:transparent;color:#8a6038;text-decoration:underline;font-size:14px}
.boot-toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:1001;display:flex;align-items:center;gap:10px;
  max-width:calc(100vw - 24px);padding:8px 8px 8px 16px;border-radius:18px;background:#fff6e0;color:#5a3a1e;box-shadow:0 4px 0 #d6a85a,0 10px 24px rgba(70,40,5,.3);
  font:900 14px/1.25 "MarbotBoot","Nunito",ui-rounded,system-ui,sans-serif;animation:bootIn .35s cubic-bezier(.34,1.6,.5,1)}
.boot-toast.err{background:#fff0ec;box-shadow:0 4px 0 #e59a86,0 10px 24px rgba(90,30,10,.3)}
.boot-toast button{padding:8px 14px}
.boot-toast button.x{background:none;color:#8a6038;padding:6px 10px;font-size:18px}
@keyframes bootBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes bootIn{from{transform:translate(-50%,20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@media (prefers-reduced-motion:reduce){#boot .logo{animation:none}#bootBar{transition:none}}
noscript div{position:fixed;inset:0;z-index:1002;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:#fff6e0;color:#5a3a1e;font:800 17px/1.5 system-ui,sans-serif}

  <div id="bootProgress" role="progressbar" aria-label="Memuat / Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="bootBar"></div></div>
  <div id="bootLabel" aria-live="polite"></div>
  <div id="bootMsg" role="alert"></div>
  <div id="bootVer"></div>
</div>
